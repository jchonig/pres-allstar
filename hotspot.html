# Setting up a Hotspot
### *Draft*

Jeffrey Honig — N2VLV

[n2vlv.net](https://n2vlv.net/) — [n2vlv@honig.net](mailto:n2vlv@honig.net)

[Allstar Presentation](index.html)

Note:
Today we'll focus on hotspots — personal AllStar nodes that let you
connect your HT or mobile radio to the worldwide AllStar network.

---

## What is an AllStar Hotspot?

- A small, low-power FM radio linked to the AllStar network via the internet
- Lets you use a handheld or mobile radio to reach nodes worldwide
- Typically UHF (70 cm) or VHF (2 m), 100–500 mW output
- Sits on your desk, in your shack, or travels with you
- Registers as a standard AllStar node — just smaller

Note:
A hotspot is really just a miniature repeater that doesn't repeat —
it bridges your local RF signal to the internet.
Your HT keys up the hotspot, and its audio travels over the internet
to whatever AllStar node or hub you're connected to.
No wide-area coverage needed; you're typically talking to it from the same room.

---

## Pre-Assembled Hotspots

- Ready to use out of the box
- Pre-configured with ASL3 software
- You supply your node number and credentials
- Great if you don't want to build

Note:
Several vendors sell fully assembled hotspots.
Most ship pre-configured — you just plug them in, enter your node number,
and they're on the air.

## SHARI PiZero

<!-- .slide: style="font-size: 0.75em;" -->

[kits4hams.com/shari-pizero](https://kits4hams.com/shari-pizero) — **$205** assembled

- Raspberry Pi Zero 2W + NiceRF SA818 radio module
- UHF (420–450 MHz) or VHF (144–148 MHz)
- CMedia CM108B USB audio IC
- LTCC low-pass filter for FCC Part 97 compliance
- Hammond aluminum enclosure (~3.25 × 2.25 × 1")
- 250–500 mW RF output
- Also available as a kit ($100) or parts-only

[Setup guide (PDF)](https://kits4hams.com/wp-content/uploads/2026/01/SHARI-PiZero-Allstar-Node-Setup-Procedure-Version-1.02.pdf)

Note:
The SHARI PiZero is one of the most popular hotspot kits.
SHARI stands for SA818 Ham Allstar Radio Interface, designed by N8AR.
The fully assembled version includes the Pi Zero 2W and power supply.
Add $9 for US shipping. Also available in a kit form for the builder.

## HotSpotRadio

<!-- .slide: style="font-size: 0.75em;" -->

[hotspotradios.com/hotspotradio](https://hotspotradios.com/hotspotradio) — **$298 + $18 shipping**

- Raspberry Pi 3B with custom PiHat
- NiceRF SA818 UHF radio module, 100–400 mW
- CMedia CM119B USB audio interface
- Arrives pre-configured — no audio adjustment needed
- PTT, COR, and Heartbeat status LEDs
- C4LABS case, 5.1V/2.5A power supply, and antenna included

[Setup guide (PDF)](https://img1.wsimg.com/blobby/go/ff059e81-344b-4c02-a7fa-7e64e47ae407/downloads/HotSpotRadio%20Construction%20and%20Configuration%20Ve.pdf)

Note:
The HotSpotRadio ships with your node number, frequency, and CTCSS
already programmed — truly plug-and-play.
Uses the SA818 UHF module on a custom Pi hat.
The 6-second power button provides a safe shutdown.

## ClearNode

<!-- .slide: style="font-size: 0.75em;" -->

[node-ventures.com/buy-clearnode](https://www.node-ventures.com/buy-clearnode/) — **$495**

- Raspberry Pi-based with integrated UHF or VHF transceiver
- AllStar, EchoLink, and digital modes (DMR, P25, YSF, NXDN)
- **Mobile app** (iOS and Android) for remote control and configuration
- WiFi setup without SSH or terminal
- Requires a valid amateur radio license to purchase

[Getting started](https://www.node-ventures.com/getting-started/) — [YouTube: Introduction to ClearNode and Allstar](https://www.youtube.com/watch?v=5at_1Cq5F_8)

Note:
The ClearNode stands out for its mobile app — you can configure and control
the node entirely from your phone without touching a command line.
It supports digital modes via DVSwitch in addition to standard AllStar.
Also supports audio streaming to mobile (~20-second delay) and timed event automation.
Higher price point reflects the polished software ecosystem.

## Micro-Node Nano-AE-M1

[micro-node.com/nano-ae-m1.shtml](http://www.micro-node.com/nano-ae-m1.shtml) — **$495+**

- Standalone self-contained hotspot with built-in LCD touchscreen
- Integrated 420–450 MHz, 200 mW UHF radio
- Menu-based UI — no Linux knowledge required
- One of the original AllStar personal hotspots
- Configure and operate entirely through the touchscreen

[User manual (PDF)](http://micro-node.com/nano-ae_user.pdf)

Note:
The Micro-Node Nano-AE-M1 is notable for its LCD touchscreen interface —
you don't need SSH or a web browser to connect to nodes.
It's one of the oldest commercial AllStar hotspot products.
Check the store at micro-node.com/store/ for current pricing.

## Radio-less Nodes

- A node with **no radio** — connects to AllStar purely over the internet
- Use a speaker-mic, headset, or softphone instead of an HT
- Useful for hubs, conference bridges, and monitoring
- Great for EmComm operators who want to join a net without RF
- A laptop or desktop can be a radio-less node

Note:
Radio-less nodes are full AllStar nodes — they have a node number,
can connect to and from any other node, and can host nets.
The only difference is there's no RF link: audio goes in and out
via a USB speaker-mic, headset, or softphone client.
The AllScan ANR series uses a UCI (USB Console Interface) for this purpose.
This is also what the AllScan radioless node and the Random Wire #180 episode cover.

## Building a Hotspot

- Use a Raspberry Pi Zero 2W, Pi 3B+, or Pi 4
- Add a radio interface board or USB radio module
- Install ASL3 (AllStarLink 3) — the official software
- Register your node at [allstarlink.org](https://allstarlink.org)

Note:
Building your own hotspot gives you more flexibility and lower cost.
The Pi Zero 2W is the most compact and lowest-power option.
The Pi 3B+ and Pi 4 give you more headroom for monitoring tools
like Allmon3 and AllScan.

## Radio Interfaces

<!-- .slide: style="font-size: 0.75em;" -->

| Interface | Form | Price |
|-----------|------|-------|
| [HotSpotRadio-USB](https://hotspotradios.com/hotspotradio-usb) | USB dongle | $98 + shipping |
| [SHARI PiXX](https://kits4hams.com/shari) | Pi3/Pi4 USB module | $80 kit / $105 assembled |
| [SHARI PiHat](https://kits4hams.com/shari-pihat) | Pi4 HAT in metal case | $235+ assembled |
| [SHARI PiZero](https://kits4hams.com/shari-pizero) | Pi Zero 2W module | $100 kit / $205 assembled |
| [AURSINC Pi Hat](https://www.aursinc.com/products/aursinc-allstar-rf-node-uhf-sr-frs-radio-programming-module-pi-hat-for-allstar-echolink-aprs-digital-modes-compatible-for-raspberry-pi-2-3-4-pin-to-pin-replace-sa-818-module-uhf-freq-400-470) | Pi HAT (SA-818 compatible) | ~$69 |

All use UHF or VHF FM — 100–500 mW output

Note:
The HotSpotRadio-USB is unique — it's a self-contained USB stick with a radio built in,
so it works with any computer or Pi running ASL3.
The SHARI family (designed by N8AR) are the most popular Pi-native interfaces
and come in kit or assembled forms.
The AURSINC board is an SA-818 pin-compatible alternative available on Amazon.

## Storage: High-Endurance SD Card

- Standard SD cards wear out quickly with OS logging
- Use a **high-endurance** microSD card rated for continuous write cycles
- Recommended: Samsung PRO Endurance or SanDisk High Endurance
- 32 GB is sufficient for ASL3

Note:
AllStar nodes write logs continuously — a normal SD card can fail in months.
High-endurance cards are designed for dashcams and security cameras
with similar always-on write patterns.
This is a cheap insurance policy against losing your node configuration.

## Softphones

Connect to AllStar without a radio — via AllStar network login or directly to your node

- **RepeaterPhone** (iOS) — [repeaterphone.com](https://repeaterphone.com/)
- **Tranceive** (macOS)
- **Android** — no mature option yet; **QSO One** ([qso1.net](https://qso1.net/)) is coming
- **Windows** — **QSO One** is also coming for Windows

Note:
Softphones connect to your AllStar node over the internet
and let you use it like a walkie-talkie from your phone or computer.
RepeaterPhone is the most polished option on iOS.
Tranceive is a clean native macOS app.
Android and Windows users are waiting on QSO One, which is currently in development.
